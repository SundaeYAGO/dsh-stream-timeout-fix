name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is deliberately absent: the `undici` dependency declares
        # engines.node >= 22.19.0, so importing it on Node 20 fails (that is
        # what broke run #1). Any DSH build that can mount this plugin already
        # bundles undici 8.x itself, so 22/24 is the real deployment range.
        # Keep in sync with package.json engines.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
